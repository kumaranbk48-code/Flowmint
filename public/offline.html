<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowMint — Offline Cashbook</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f6f3;
      color: #1c1917;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(196, 90, 44, 0.1);
      color: #c45a2c;
      margin-bottom: 20px;
      font-size: 28px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #78716c;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background: #c45a2c;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: #ad4d23;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 12px;
      color: #a8a29e;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">⚡</div>
    <h1>You are currently offline</h1>
    <p>FlowMint works 100% offline. Any transactions or voice entries you record while offline are safely saved locally on your device and will automatically sync when you reconnect.</p>
    <a href="/" class="btn">Open FlowMint Cashbook</a>
    <div class="status">
      <span class="dot"></span>
      <span>Local offline storage active</span>
    </div>
  </div>
</body>
</html>
